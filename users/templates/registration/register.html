{% extends "base.html" %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap');
  .font-display { font-family: 'Sora', 'Inter', sans-serif; }

  .task-card {
    animation: cardIn 0.6s ease-out both;
  }
  .task-card:nth-child(1) { animation-delay: 0.05s; }
  .task-card:nth-child(2) { animation-delay: 0.18s; }
  .task-card:nth-child(3) { animation-delay: 0.31s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .task-card { animation: none; }
  }
</style>

<div class="min-h-[85vh] flex bg-[#FAFAF8]">

  <!-- Signature panel -->


</div>
{% endblock content %}
