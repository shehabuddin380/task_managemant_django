{% extends "base.html" %}
{% block title %}Contact - TaskMaster{% endblock %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap');
  .font-display { font-family: 'Sora', 'Inter', sans-serif; }
</style>

<section class="min-h-[80vh] bg-gradient-to-br from-[#161B33] to-[#232B52] py-20 md:py-28">
  <div class="container mx-auto px-6 flex flex-col lg:flex-row lg:items-center gap-14">

    <div class="lg:w-1/2 text-white">
      <span class="inline-block text-xs font-semibold tracking-widest uppercase text-[#2DD4BF] bg-[#2DD4BF]/10 px-3 py-1 rounded-full mb-6">
        Get in touch
      </span>
      <h1 class="font-display font-bold text-4xl leading-tight mb-6">
        Questions about TaskMaster?
      </h1>
      <p class="text-[#9AA3C0] text-lg leading-relaxed max-w-md">
        Whether you're setting up your team's workspace or just curious how roles and
        permissions work, send us a message — we read every one.
      </p>
    </div>  

  </div>
</section>
{% endblock %}
