{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Projects</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        {% for project in projects %}
            <a href="{% url 'project-tasks' project.id %}"
               class="group bg-white rounded-xl shadow-sm p-5 flex flex-col justify-between
                      border border-gray-100 hover:shadow-md hover:border-blue-200
                      hover:-translate-y-0.5 transition-all duration-200">
                <div class="flex items-start justify-between mb-3">
                    <div class="bg-blue-50 p-2.5 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke-width="1.8" stroke="currentColor" class="w-5 h-5 text-blue-600">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-19.5 0v6a2.25 2.25 0 0 0 2.25 2.25h15a2.25 2.25 0 0 0 2.25-2.25v-6m-19.5 0h19.5M12 6.75h.008v.008H12V6.75Z" />
                        </svg>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke-width="2" stroke="currentColor"
                         class="w-4 h-4 text-gray-300 group-hover:text-blue-500 group-hover:translate-x-0.5 transition-all">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-semibold text-gray-800 group-hover:text-blue-700 transition-colors">
                        {{ project.name }}
                    </h2>
                    <p class="text-gray-400 text-sm mt-1">{{ project.num_task }} task{{ project.num_task|pluralize }}</p>
                </div>
            </a>
        {% empty %}
            <p class="text-gray-500 col-span-full">No projects found.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
